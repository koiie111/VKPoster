{
  "openapi": "3.1.0",
  "info": {
    "title": "VKPoster Public API",
    "version": "1.0.0",
    "description": "Workspace API (Pro+), Bearer-only, no cookies/CSRF/session authentication. Token is shown once. Scopes: posts:read, posts:write, channels:read, media:write, stats:read. See /help/public-api for curl, n8n, Make and webhook signing."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
