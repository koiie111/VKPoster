server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 55m;

    # Resolve the PHP upstream lazily so nginx starts even while `app` is being recreated.
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;

    # Never serve dotfiles (.env, .git, ...).
    location ~ /\. {
        deny all;
        return 404;
    }

    location /assets/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
    }

    # Any other .php request is not a front controller.
    location ~ \.php$ {
        return 404;
    }
}
