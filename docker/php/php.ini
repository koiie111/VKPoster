; Shared settings (production defaults; php-dev.ini relaxes them for local work).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 55M
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 0
