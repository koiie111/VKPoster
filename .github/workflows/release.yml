name: Production release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  check-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Tag must point to main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  checks:
    needs: check-main
    uses: ./.github/workflows/ci.yml
  security:
    needs: check-main
    uses: ./.github/workflows/security.yml
  images:
    needs: [checks, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: prod, suffix: app, context: ., file: docker/php/Dockerfile}
          - {target: web, suffix: web, context: ., file: docker/php/Dockerfile}
          - {target: ops, suffix: ops, context: ., file: docker/php/Dockerfile}
          - {target: '', suffix: reader, context: tools/telegram-reader, file: tools/telegram-reader/Dockerfile}
          - {target: '', suffix: crypto, context: docker/openbao, file: docker/openbao/Dockerfile}
          - {target: server, suffix: mysql, context: docker/mysql, file: docker/mysql/Dockerfile}
          - {target: '', suffix: redis, context: docker/redis, file: docker/redis/Dockerfile}
          - {target: '', suffix: caddy, context: docker/caddy, file: docker/caddy/Dockerfile}
          - {target: '', suffix: pdf, context: tools/analytics-pdf, file: tools/analytics-pdf/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: candidate
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vkposter-${{ matrix.suffix }}:candidate-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan exact candidate digest and record promotion contract
        env:
          SUFFIX: ${{ matrix.suffix }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/vkposter-${{ matrix.suffix }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: python3 scripts/release-artifacts.py record "$SUFFIX" "$REPOSITORY" "$DIGEST" image-manifests
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.suffix }}
          path: image-manifests/*.json
          if-no-files-found: error
  verify-runtime:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with: {pattern: 'candidate-*', path: image-manifests, merge-multiple: true}
      - name: Load only scanned digest artifacts under isolated fixture aliases
        run: python3 scripts/release-artifacts.py runtime image-manifests
      - name: Prepare test harness (not a release image)
        run: |
          docker build --target dev -t ezposter-crypto-test:stage19 -f docker/php/Dockerfile .
          docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_CACHE_DIR=/tmp/composer -v "$PWD:/var/www/html" ezposter-crypto-test:stage19 composer install --no-scripts --no-interaction --prefer-dist
          mkdir -p storage/logs storage/tmp storage/cache/twig
          chmod 0777 storage/logs storage/tmp storage/cache storage/cache/twig
      - name: Verify actual scanned production artifacts
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/security/operations-tls-stand.py
          python3 scripts/security/crypto-stand.py
          sh scripts/security/mysql84-pitr-stand.sh
          python3 scripts/security/production-stand.py
  promote:
    needs: verify-runtime
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with: {pattern: 'candidate-*', path: image-manifests, merge-multiple: true}
      - name: Promote unchanged manifests and create digest-pinned deployment input
        env:
          VERSION: ${{ github.ref_name }}
          PREFIX: ghcr.io/${{ github.repository_owner }}/vkposter
        run: python3 scripts/release-artifacts.py promote image-manifests "$VERSION" "$PREFIX" release-images.env
      - uses: actions/upload-artifact@v4
        with: {name: release-images, path: release-images.env, if-no-files-found: error}
  deploy:
    needs: promote
    if: github.repository == 'koiie111/VKPoster' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: release-images, path: .}
      - name: Deploy through pinned SSH host and protected environment
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE: ${{ github.ref_name }}
          WITH_ANALYTICS: ${{ vars.PRODUCTION_ANALYTICS_ENABLED }}
          SCHEMA_COMPATIBLE: ${{ vars.RELEASE_SCHEMA_BACKWARD_COMPATIBLE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          WITH_ANALYTICS=${WITH_ANALYTICS:-false}
          [[ "$WITH_ANALYTICS" == true || "$WITH_ANALYTICS" == false ]] || exit 2
          [[ "$SCHEMA_COMPATIBLE" == true ]] || { echo "Explicit release schema compatibility declaration required" >&2; exit 2; }
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh_options=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts")
          # First 19.8 deploy provisions /opt/ezposter and a read-only GHCR pull login on the host.
          scp "${ssh_options[@]}" release-images.env "$DEPLOY_USER@$DEPLOY_HOST:/opt/ezposter/release-images.env"
          scp "${ssh_options[@]}" compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:/opt/ezposter/compose.prod.yaml"
          scp "${ssh_options[@]}" scripts/deploy-release.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/ezposter/deploy-release.sh"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_ANALYTICS=$WITH_ANALYTICS MIGRATIONS_BACKWARD_COMPATIBLE=true bash /opt/ezposter/deploy-release.sh '$RELEASE' 'ghcr.io/koiie111/vkposter' '/opt/ezposter/release-images.env'"
