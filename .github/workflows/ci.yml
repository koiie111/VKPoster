name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: app_test
      DB_USERNAME: app
      DB_PASSWORD: app
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: dev
          load: true
          tags: vkposter-app-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create test database
        run: |
          docker exec "$(docker ps -qf ancestor=mysql:8.0)" \
            mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS app_test; GRANT ALL ON app_test.* TO 'app'@'%';"

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Run checks in the dev image
        shell: bash
        run: |
          mkdir -p ~/.cache/composer
          sudo chown -R 1000:1000 ~/.cache/composer . 2>/dev/null || true
          docker run --rm --network host \
            -e APP_ENV -e DB_HOST -e DB_PORT -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD -e REDIS_HOST -e REDIS_PORT \
            -e COMPOSER_CACHE_DIR=/composer-cache \
            -v "$PWD:/var/www/html" -v "$HOME/.cache/composer:/composer-cache" \
            vkposter-app-dev bash -euo pipefail -c '
              composer install --no-interaction --prefer-dist
              sh scripts/build-css.sh
              sh scripts/build-css.sh --check
              composer cs
              composer stan
              composer test
              composer audit
            ' 2>&1 | tee /tmp/vkposter-check.log

      - name: Report failed check diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('/tmp/vkposter-check.log')
          if p.exists():
              message = '\n'.join(p.read_text(errors='replace').splitlines()[-65:])
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Dev image check failure::' + message)
          PYCODE

      - name: Build API reference (phpDocumentor)
        run: docker run --rm -v "$PWD:/data" phpdoc/phpdoc:3 run -d src -t docs/reference

  # The Python reader lives in its own image (ADR 0011); its offline tests run without network, like on a developer machine.
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build reader image
        uses: docker/build-push-action@v6
        with:
          context: tools/telegram-reader
          load: true
          tags: vkposter-telegram-reader
          cache-from: type=gha,scope=reader
          cache-to: type=gha,mode=max,scope=reader

      - name: Offline tests
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint python \
            vkposter-telegram-reader -m unittest discover -s tests -v

  analytics-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build isolated PDF renderer
        uses: docker/build-push-action@v6
        with:
          context: tools/analytics-pdf
          load: true
          tags: vkposter-analytics-pdf
          cache-from: type=gha,scope=analytics-pdf
          cache-to: type=gha,mode=max,scope=analytics-pdf
      - name: Offline HTML-to-PDF HTTP contract
        shell: bash
        run: |
          docker run -d --name analytics-pdf -e APP_KEY=synthetic-pdf-contract -p 127.0.0.1:18187:3000 vkposter-analytics-pdf
          PDF_TEST_KEY=synthetic-pdf-contract python3 tools/analytics-pdf/smoke.py 2>&1 | tee /tmp/vkposter-pdf.log
      - name: Report failed PDF diagnostics
        if: failure()
        run: |
          docker logs analytics-pdf > /tmp/vkposter-pdf-container.log 2>&1 || true
          python3 - <<'PYCODE'
          from pathlib import Path
          for name in ('pdf', 'pdf-container'):
              p = Path('/tmp/vkposter-' + name + '.log')
              if p.exists():
                  message = '\n'.join(p.read_text(errors='replace').splitlines()[-40:])
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Renderer ' + name + ' failure::' + message)
          PYCODE
