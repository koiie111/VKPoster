# Local development stack. All published ports are bound to 127.0.0.1 only.
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: vkposter-app-dev
  env_file: [.env]
  environment:
    DB_HOST: mysql
    REDIS_HOST: redis
    MAIL_HOST: mailpit
  volumes:
    - .:/var/www/html
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  app:
    <<: *app

  worker:
    <<: *app
    command: ["php", "bin/console", "queue:work"]
    restart: unless-stopped

  scheduler:
    <<: *app
    command: ["php", "bin/console", "schedule:run"]
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/app.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:8025:8025"]

  minio:
    image: minio/minio
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-minioadmin}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  ui-snap:
    build: tools/ui-snap
    image: vkposter-ui-snap
    profiles: [tools]
    volumes: [".:/work"]
    depends_on: [nginx]

  tunnel:
    image: cloudflare/cloudflared
    profiles: [tunnel]
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on: [nginx]

volumes:
  mysql-data:
  minio-data:
