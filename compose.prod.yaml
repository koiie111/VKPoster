# Production stack: `docker compose -f compose.prod.yaml up -d --build`. No mailpit, MinIO, tunnel or UI tools.
# Everything is published on 127.0.0.1 only: put a TLS-terminating reverse proxy (nginx, Caddy) in front and set APP_URL to the https address.
# Settings come from `.env` (start from `.env.production.example`); see docs/deploy.md.
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: ${APP_IMAGE:-ezposter-app:prod}
  env_file: ["${APP_ENV_FILE:-.env}"]
  environment:
    APP_ENV: production
    DB_HOST: mysql
    REDIS_HOST: redis
    CRYPTO_BACKEND: vault
    VAULT_TOKEN_FILE: /run/secrets/transit-app.token
    VAULT_CA_FILE: /run/secrets/transit-ca.pem
    MALWARE_SCANNER: clamd
  volumes:
    - app-storage:/var/www/html/storage
    - type: bind
      source: ${VAULT_APP_TOKEN_HOST_PATH:-/etc/ezposter/transit-app.token}
      target: /run/secrets/transit-app.token
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${VAULT_CA_HOST_PATH:-/etc/ezposter/transit-ca.pem}
      target: /run/secrets/transit-ca.pem
      read_only: true
      bind: {create_host_path: false}
  init: true
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 768m
  cpus: 1.0
  pids_limit: 128
  stop_grace_period: 120s
  logging: &logging
    driver: local
    options: {max-size: "10m", max-file: "5"}
  healthcheck:
    test: ["CMD", "php", "scripts/runtime-health.php", "app"]
    interval: 30s
    timeout: 6s
    retries: 3
    start_period: 30s
  restart: unless-stopped
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    clamav: { condition: service_healthy }

services:
  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: ${WEB_IMAGE:-ezposter-web:prod}
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:80"]
    restart: unless-stopped
    depends_on: [app]
    read_only: true
    tmpfs: [/var/cache/nginx:size=32m, /var/run:size=1m, /tmp:size=16m]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    <<: *app

  worker:
    <<: *app
    command: ["php", "bin/console", "queue:work", "--queue=publish,default"]
    healthcheck:
      test: ["CMD", "php", "scripts/runtime-health.php", "worker:publish", "worker:default"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Exactly one scheduler: it starts publications, health checks, renewals and clean-ups.
  scheduler:
    <<: *app
    command: ["php", "bin/console", "schedule:run"]
    deploy: {replicas: 1}
    healthcheck:
      test: ["CMD", "php", "scripts/runtime-health.php", "scheduler"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  analytics-worker:
    <<: *app
    command: ["php", "bin/console", "queue:work", "--queue=analytics"]
    healthcheck:
      test: ["CMD", "php", "scripts/runtime-health.php", "worker:analytics"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  backup:
    <<: *app
    profiles: [ops]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ops
    image: ${OPS_IMAGE:-ezposter-ops:prod}
    command: ["sh", "-ec", "php bin/console ops:backup backup /backup; php bin/console ops:backup binlogs /backup; php bin/console ops:backup check-media"]
    group_add: ["${BACKUP_MYSQL_GID:-999}"]
    environment:
      APP_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
      BACKUP_KEY_FILE: /run/secrets/backup.key
      BACKUP_DB_SOCKET: /run/mysql/mysqld.sock
      CRYPTO_BACKEND: vault
      VAULT_TOKEN_FILE: /run/secrets/transit-app.token
      VAULT_CA_FILE: /run/secrets/transit-ca.pem
      MALWARE_SCANNER: clamd
    volumes:
      - app-storage:/var/www/html/storage:ro
      - type: bind
        source: ${VAULT_APP_TOKEN_HOST_PATH:-/etc/ezposter/transit-app.token}
        target: /run/secrets/transit-app.token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VAULT_CA_HOST_PATH:-/etc/ezposter/transit-ca.pem}
        target: /run/secrets/transit-ca.pem
        read_only: true
        bind: {create_host_path: false}
      - mysql-data:/mysql-binlog:ro
      - mysql-run:/run/mysql:ro
      - type: bind
        source: ${BACKUP_KEY_HOST_PATH:-/etc/ezposter/backup.key}
        target: /run/secrets/backup.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BACKUP_DIRECTORY:-/var/backups/ezposter}
        target: /backup
        bind: {create_host_path: false}
    healthcheck: {disable: true}
    restart: "no"

  analytics-pdf:
    build: tools/analytics-pdf
    image: ${PDF_IMAGE:-ezposter-pdf:prod}
    profiles: [analytics]
    environment:
      CRYPTO_BACKEND: vault
      VAULT_PDF_VERIFY_URL: ${VAULT_TRANSIT_URL}/v1/transit/verify/${VAULT_TRANSIT_KEY:-vkposter}-pdf/sha2-256
      VAULT_PDF_TOKEN_FILE: /run/secrets/transit-pdf.token
      NODE_EXTRA_CA_CERTS: /run/secrets/transit-ca.pem
    volumes:
      - type: bind
        source: ${VAULT_PDF_TOKEN_HOST_PATH:-/etc/ezposter/transit-pdf.token}
        target: /run/secrets/transit-pdf.token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${VAULT_CA_HOST_PATH:-/etc/ezposter/transit-ca.pem}
        target: /run/secrets/transit-ca.pem
        read_only: true
        bind: {create_host_path: false}
    init: true
    read_only: true
    tmpfs: [/tmp:size=256m]
    shm_size: 256mb
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped

  mysql:
    build:
      context: docker/mysql
      target: server
    image: ${MYSQL_IMAGE:-ezposter-mysql:prod}
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 256
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-run:/var/run/mysqld
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/app.cnf:ro
      - ./docker/mysql/production.cnf:/etc/mysql/conf.d/production.cnf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # No host port. A separate scanner process owns signatures; application never mounts its database.
  clamav:
    image: clamav/clamav:1.5.4_base@sha256:751df8dc649cc977696f107c80db4960b6317a7cb511aebc8066f3b91db6b631
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 4g
    cpus: 1.0
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    volumes: [clamav-signatures:/var/lib/clamav]
    logging: *logging
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  redis:
    build:
      context: docker/redis
    image: ${REDIS_IMAGE:-ezposter-redis:prod}
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    logging: *logging
    user: redis
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD for production}
    command: ["sh", "-ec", "umask 077; printf 'requirepass %s\\nappendonly yes\\nappendfsync everysec\\nmaxmemory 192mb\\nmaxmemory-policy noeviction\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clamav-signatures:
  mysql-data:
  mysql-run:
  redis-data:
  app-storage:
